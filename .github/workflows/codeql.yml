name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Newly published queries find bugs in code that has not changed, so the
  # scheduled run is the one that catches them.
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required to upload the SARIF results to the code scanning API. No other
      # write scope is needed: the repo is public, so CodeQL neither fetches
      # private query packs (packages: read) nor reads private run metadata
      # (actions: read).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:python"
