[project]
name = "price-of-ethereum"
version = "0.1.0"
description = "Measure block-level onchain price and depth for any token pair from your own Fynd instance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PropellerHeads" }
]
keywords = ["defi", "ethereum", "market-data", "price-impact", "liquidity", "tycho", "fynd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0",
]
parquet = [
    "price-of-ethereum[data]",
    # pandas drives the parquet engine and declares pyarrow>=13 for it, so that
    # is the real floor; anything higher would be an invented constraint.
    "pyarrow>=13",
]
viz = [
    "price-of-ethereum[data]",
    "plotly>=6.9.0",
]

[project.urls]
Homepage = "https://github.com/propeller-heads/price-of-ethereum"
Repository = "https://github.com/propeller-heads/price-of-ethereum"
Issues = "https://github.com/propeller-heads/price-of-ethereum/issues"
LiveSite = "https://marketprice.xyz/"

[project.scripts]
poe = "price_of_ethereum.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# CI syncs with --locked, which requires the lockfile to match the format the
# running uv expects, and that format changes between uv releases. Pinning here
# rather than in the workflow keeps CI and contributors on the one uv that wrote
# uv.lock; setup-uv reads this field. Bump it and re-lock in the same commit.
required-version = "==0.11.32"

[tool.uv.build-backend]
source-include = ["examples/**", "specs/**", "tests/**"]

[dependency-groups]
# ruff and ty are pinned rather than floored: they decide whether `ruff format
# --check` and `ty check` pass, and CI runs the versions in uv.lock. A pip user
# installing from these floors would otherwise get a newer formatter and see a
# failure on a file they never edited. pytest only runs the suite, so a floor
# is enough.
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.22",
    "ty==0.0.61",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
