[project]
name = "price-of-ethereum"
version = "0.1.0"
description = "Measure block-level onchain price and depth for any token pair from your own Fynd instance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "pistomat", email = "pistomat@users.noreply.github.com" }
]
keywords = ["defi", "ethereum", "market-data", "price-impact", "liquidity", "tycho", "fynd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pydantic>=2",
]

[project.optional-dependencies]
viz = [
    "plotly>=6.9.0",
]

[project.urls]
Homepage = "https://github.com/propeller-heads/price-of-ethereum"
Repository = "https://github.com/propeller-heads/price-of-ethereum"
Issues = "https://github.com/propeller-heads/price-of-ethereum/issues"

[project.scripts]
poe = "price_of_ethereum.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.60",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
