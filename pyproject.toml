[project]
name = "price-of-ethereum"
version = "0.1.0"
description = "Regenerate block-level onchain price and depth data for any token pair from your own local Fynd — the measured data behind marketprice.xyz, run yourself."
readme = "README.md"
authors = [
    { name = "pistomat", email = "pistomat@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pydantic>=2",
]

[project.optional-dependencies]
viz = [
    "plotly>=6.9.0",
]

[project.scripts]
poe = "price_of_ethereum.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.60",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
